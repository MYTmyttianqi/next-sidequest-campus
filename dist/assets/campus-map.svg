    <path d="m186 187 63-5 1 10-63 5Z" fill="#BDCAA8" stroke-width="1.2"/>
    <path d="m170 176 16 11 1 10-16-10Z" fill="#9EB18E" stroke-width="1.2"/>
    <path d="m215 224 17-1 1 22-17 1Z" fill="#8EA693" stroke-width="1.2"/>
    <path d="m209 247 31-2 3 5-31 2Z" fill="#D1D5BC" stroke-width="1"/>
    <g transform="translate(192 209) skewY(-5)"><use href="#window"/><use href="#window" x="15"/><use href="#window" x="45"/><use href="#window" x="60"/></g>
    <path d="m166 199 7 4m-6 7 7 4m-6 7 7 4" stroke-width="2"/>
  </g>
  <text x="194" y="269" fill="#3F5D4F" font-family="system-ui,sans-serif" font-size="10" letter-spacing="2">图书馆</text>

