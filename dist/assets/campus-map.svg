    <path d="m441 142 79-6 1 6-79 6Z" fill="#B4C09F" stroke-width="1.1"/>
    <g transform="translate(446 164) skewY(-4)"><use href="#window"/><use href="#window" x="17"/><use href="#window" x="34"/><use href="#window" x="51"/><use href="#window" x="68"/></g>
    <g transform="translate(447 183) skewY(-4)"><use href="#window"/><use href="#window" x="17"/><use href="#window" x="51"/><use href="#window" x="68"/></g>
    <path d="m479 180 13-1 1 20-13 1Z" fill="#8AA18B" stroke-width="1.1"/>
    <path d="m421 206 119-9 3 6-120 9Z" fill="#DADCC6" stroke-width="1.1"/>
  </g>
  <text x="455" y="230" fill="#3F5D4F" font-family="system-ui,sans-serif" font-size="10" letter-spacing="2">教学楼 B</text>

  <!-- Athletic track and its field. -->
  <g id="sports-ground" transform="translate(198 404) rotate(-4)">
    <rect x="-54" y="-45" width="108" height="90" rx="40" fill="#D5AA87" stroke="#57745D" stroke-width="1.3"/>
    <rect x="-47" y="-38" width="94" height="76" rx="34" stroke="#F7EDDA" stroke-width="1"/>
    <rect x="-40" y="-31" width="80" height="62" rx="28" stroke="#F7EDDA" stroke-width="1"/>
