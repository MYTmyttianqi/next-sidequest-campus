<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" fill="none" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">下一条支线 · 校园冒险地图</title>
  <desc id="map-desc">一张手账风格的原创校园地图，画有教学楼、图书馆、操场、池塘和树木。橘红色虚线串起三个冒险节点，边缘放着纸条和校园卡。</desc>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#173D36" stroke-opacity=".055" stroke-width=".7"/></pattern>
    <pattern id="water-lines" width="28" height="13" patternUnits="userSpaceOnUse"><path d="M3 7c4-3 7 3 11 0s7 3 11 0" stroke="#73968B" stroke-width="1" opacity=".65"/></pattern>
    <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#173D36" flood-opacity=".08"/></filter>
    <g id="tree"><path d="M0 9v13M-5 22H5" stroke="#244D40" stroke-width="1.6" stroke-linecap="round"/><path d="M-10 7C-16 0-10-8-5-8c-1-9 13-12 15-3 9-1 14 10 7 15 3 8-10 13-15 6-4 5-10 3-12-3Z" fill="#B7C5A8" stroke="#315844" stroke-width="1.4"/><path d="M0-6v16M0 3-6-1M0 1 7-4" stroke="#42644B" stroke-width="1.1" stroke-linecap="round"/></g>
    <g id="pine"><path d="M0 10v12" stroke="#244D40" stroke-width="1.5"/><path d="m0-18-10 15h5l-10 15h30L5-3h5L0-18Z" fill="#82997B" stroke="#315844" stroke-width="1.2" stroke-linejoin="round"/></g>
    <g id="bush"><path d="M-11 4c-6-7 2-14 8-9 3-10 16-6 15 2 7 3 4 11-3 11H-6c-4 0-6-1-5-4Z" fill="#C4CDAE" stroke="#617852" stroke-width="1.1"/></g>
    <g id="bench"><path d="m-11-4 22-3M-10 0l22-3M-10 0v5M11-3v5" stroke="#62735C" stroke-width="1.8" stroke-linecap="round"/></g>
    <g id="window"><path d="M0 0h8v10H0z" fill="#D7DBCB" stroke="#3F6356" stroke-width="1"/><path d="M4 0v10" stroke="#789184" stroke-width=".7"/></g>
    <g id="route-node"><circle r="20" fill="#F7F1E5" stroke="#D8613F" stroke-width="1.6"/><circle r="14.5" fill="#D8613F"/></g>
  </defs>

  <!-- Folded map: every architectural and landscape element remains editable. -->
  <g filter="url(#paper-shadow)">
    <path d="m67 94 546-33 49 434-537 40-17-190Z" fill="#F6F0E3" stroke="#D8D3C5" stroke-width="1.2"/>
    <path d="m67 94 546-33 49 434-537 40-17-190Z" fill="url(#paper-grid)"/>
    <path d="m237 84 34 440M419 73l35 440" stroke="#D8D1C0" stroke-opacity=".6" stroke-width="1.1"/>
    <path d="m244 84 34 440M426 73l35 440" stroke="#FFFDF6" stroke-opacity=".8" stroke-width="1.3"/>
  </g>

  <!-- Campus parcels and pedestrian walks. -->
  <path d="m131 157 139-9 12 100-137 9Z" fill="#E7E5CF"/>
  <path d="m371 122 186-11 10 126-180 12Z" fill="#E3E5CF"/>
  <path d="m310 332 122-10 12 125-125 10Z" fill="#E2E5D0"/>
  <path d="m125 342 126-9 12 124-126 10Z" fill="#E4E4CD"/>
  <path d="m306 110 25 340M105 291l504-31M117 476l506-37" stroke="#D9D2BD" stroke-width="23"/>
  <path d="m306 110 25 340M105 291l504-31M117 476l506-37" stroke="#FDF9EE" stroke-width="17"/>
  <path d="m127 347 115-7M385 123l8 118M457 258l15 175M269 369l57-4" stroke="#D8D3C1" stroke-width="11"/>
  <path d="m127 347 115-7M385 123l8 118M457 258l15 175M269 369l57-4" stroke="#FDF9EE" stroke-width="7"/>
  <path d="m115 302 496-32" stroke="#667C67" stroke-width="1" stroke-dasharray="2 6" opacity=".4"/>

  <!-- Library with a stepped roof and light isometric facades. -->
  <g id="library" stroke="#234D40" stroke-linejoin="round">
    <path d="m159 184 84-6 24 15-84 7Z" fill="#CBD0B3" stroke-width="1.5"/>
    <path d="m159 184 24 16 3 49-24-15Z" fill="#B6C0A0" stroke-width="1.5"/>
    <path d="m183 200 84-7 3 49-84 7Z" fill="#EFEBDA" stroke-width="1.5"/>
