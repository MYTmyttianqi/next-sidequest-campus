      <path d="m0 16 21-30 8 6L8 22l-11 5 3-11Z" fill="#F3E5CF"/><path d="m18-10 8 6M0 16l8 6"/>
      <text y="44" text-anchor="middle" fill="#345A48" stroke="none" font-family="system-ui,sans-serif" font-size="10" letter-spacing="3">留下故事</text>
      <text y="-43" text-anchor="middle" fill="#345A48" stroke="none" font-family="ui-monospace,monospace" font-size="7" letter-spacing="2">03 / CREATE</text>
    </g>
  </g>
</svg>
